// Серия с пропуском: 4 выполненных дня подряд дают 1 пропуск (максимум 1).
// Пропуск не ломает и не увеличивает серию. Пропуск без запаса (или 2 подряд) — срыв.
// Срыв при серии >= 1 даёт штраф. Сегодняшний день, если ещё не выполнен, не считается пропуском.
function computeStreak(days, fromKey, todayKey, goalMin, addDays, minsOf){
  let streak = 0, best = 0, earn = 0, freeze = 0, skipsUsed = 0;
  const breaks = [];   // даты срывов (день, когда серия слетела) и длина слетевшей серии
  const skips = [];    // дни, закрытые пропуском
  if(!fromKey || fromKey > todayKey) return { streak, best, freeze, toNext: 4, breaks, skips, doneToday:false };
  const step = (k, done) => {
    if(done){
      streak++; if(streak > best) best = streak;
      if(freeze === 0){ earn++; if(earn >= 4){ freeze = 1; earn = 0; } }
    } else if(freeze > 0){
      freeze = 0; earn = 0; skipsUsed++; skips.push(k);
    } else {
      if(streak > 0) breaks.push({ date:k, lost:streak });
      streak = 0; earn = 0;
    }
  };
  for(let k = fromKey; k < todayKey; k = addDays(k, 1)) step(k, minsOf(days[k]) >= goalMin);
  const doneToday = minsOf(days[todayKey]) >= goalMin;
  if(doneToday) step(todayKey, true);
  return { streak, best, freeze, toNext: freeze ? 0 : 4 - earn, breaks, skips, skipsUsed, doneToday };
}

          inp.value = drafts[inp.id] || ""; inp.addEventListener("input", () => drafts[inp.id]=inp.value);
          const b = el("button","btn primary","Отправить"); b.type="submit";
          f.addEventListener("submit", async ev => { ev.preventDefault(); const t=inp.value.trim(); if(!t) return; b.disabled=true;
            const id = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
            if(await saveMember(cid, {comments:{[wk]:{[id]:{text:t.slice(0,300), at:new Date().toISOString()}}}})){ delete drafts[inp.id]; inp.value=""; } b.disabled=false; });
          f.append(inp,b); box.appendChild(f);
        } else box.appendChild(el("div","muted","Вступи в челлендж, чтобы комментировать."));
        td.appendChild(box); r2.appendChild(td); tb.appendChild(r2);
      }
    });
    tbl.appendChild(tb); wrap.appendChild(tbl); v.appendChild(wrap);
    v.appendChild(shareNode(cid, words));
    return v;
  }
  function shareNode(cid, words){
    const box = el("div","sharebox"); box.appendChild(el("h2",null,"Кто сколько слов добавил"));
    const ids = memberIds(cid); const counts = ids.map(uid => words.filter(w=>w.uid===uid).length); const total = counts.reduce((a,b)=>a+b,0)||1;
    const row = el("div","share"); const NS="http://www.w3.org/2000/svg"; const svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox","0 0 42 42"); svg.setAttribute("role","img");
    svg.setAttribute("aria-label", ids.map((uid,i)=>nameOf(cid,uid)+" "+Math.round(counts[i]/total*100)+"%").join(", "));
    const circ = (stroke, dash, off) => { const c=document.createElementNS(NS,"circle"); c.setAttribute("cx","21"); c.setAttribute("cy","21"); c.setAttribute("r","15.915"); c.setAttribute("fill","none"); c.setAttribute("stroke",stroke); c.setAttribute("stroke-width","6"); if(dash){ c.setAttribute("stroke-dasharray",dash); c.setAttribute("stroke-dashoffset",String(off)); } return c; };
    svg.appendChild(circ("var(--line)"));
    let off=25; ids.forEach((uid,i) => { const pct = counts[i]/total*100; if(pct<=0) return; svg.appendChild(circ(shadeOf(cid,uid)[0], pct+" "+(100-pct), off)); off-=pct; });
    const t1=document.createElementNS(NS,"text"); t1.setAttribute("x","21"); t1.setAttribute("y","22.5"); t1.setAttribute("text-anchor","middle"); t1.setAttribute("font-size","6"); t1.setAttribute("fill","var(--ink)"); t1.textContent=String(words.length); svg.appendChild(t1);
    const t2=document.createElementNS(NS,"text"); t2.setAttribute("x","21"); t2.setAttribute("y","27.5"); t2.setAttribute("text-anchor","middle"); t2.setAttribute("font-size","3"); t2.setAttribute("fill","var(--muted)"); t2.textContent="слов"; svg.appendChild(t2);
    row.appendChild(svg);
    const ul = el("ul"); ids.forEach((uid,i) => { const li = paint(el("li"), cid, uid); li.append(el("i"), el("b","num",Math.round(counts[i]/total*100)+"%"), el("span",null,nameOf(cid,uid)+" · "+counts[i]+" "+plural(counts[i],"слово","слова","слов"))); ul.appendChild(li); });
    row.appendChild(ul); box.appendChild(row); return box;
  }

  // ---------- settings ----------
  function settingsNode(cid){
    const c = ch(cid); const p = el("section","panel owner-box");
    p.appendChild(el("h2",null, "Настройки челленджа"));
    p.appendChild(el("div","hint", c.createdBy===state.me ? "Ты создатель этого челленджа." : "Ты владелец сайта и можешь менять любой челлендж."));
    const f = el("form");
    const mk = (id, label, type, val, extra) => { const l=el("label",null,label); l.htmlFor=id; const i = type==="textarea" ? el("textarea") : el("input"); if(type!=="textarea") i.type=type; i.id=id; i.value = drafts[id] ?? val; i.addEventListener("input",()=>drafts[id]=i.value); Object.assign(i, extra||{}); l.appendChild(i); return [l,i]; };
    const [l1,t] = mk("sTitle","Название","text",c.title||"",{maxLength:60});
    const [l2,tp] = mk("sTopic","Тема","text",c.topic||"",{maxLength:30});
    const [l3,ds] = mk("sDesc","Описание","textarea",c.description||"",{maxLength:400});
    const [l4,mn] = mk("sMin","Минут в день","number",goalMinOf(cid),{min:1,max:600});
    const [l5,gd] = mk("sGoal","Длительность, дней","number",goalDaysOf(cid),{min:1,max:1000});
    const [l6,st] = mk("sStart","Дата старта","date",startOf(cid));
    const [l7,pn] = mk("sPen","Штраф, ₽","number",penaltyOf(cid),{min:0,max:100000,step:50});
    const dl = el("label","check"); const dc = el("input"); dc.type="checkbox"; dc.id="sDict"; dc.checked=!!c.dictionary; dl.htmlFor="sDict"; dl.append(dc, document.createTextNode("Общий словарь новых слов"));
    const r1=el("div","row2"); r1.append(l4,l5); const r2=el("div","row2"); r2.append(l6,l7);
    f.append(l1,l2,l3,r1,r2,dl);
    const btns = el("div","btns left"); const sv = el("button","btn primary","Сохранить настройки"); sv.type="submit"; btns.appendChild(sv);
    const del = el("button","btn ghost","Удалить челлендж"); del.type="button"; let armed=false;
    del.addEventListener("click", async () => { if(!armed){ armed=true; del.textContent="Удалить навсегда? Нажми ещё раз"; setTimeout(()=>{armed=false; del.textContent="Удалить челлендж";},4000); return; }
      try{ await fs.doc("challenges/"+cid).delete(); location.hash=""; }catch(e){ setStatus(explain(e), true); } });
    btns.appendChild(del); f.appendChild(btns);
    f.addEventListener("submit", async ev => { ev.preventDefault(); sv.disabled=true;
      const ok = await saveChallenge(cid, { title: t.value.trim().slice(0,60) || c.title, topic: tp.value.trim().slice(0,30), description: ds.value.trim().slice(0,400),
        minutes: clampNum(mn.value,1,600,goalMinOf(cid)), goalDays: clampNum(gd.value,1,1000,goalDaysOf(cid)), startDate: isKey(st.value)?st.value:startOf(cid), penalty: clampNum(pn.value,0,100000,penaltyOf(cid)), dictionary: dc.checked });
      if(ok){ ["sTitle","sTopic","sDesc","sMin","sGoal","sStart","sPen"].forEach(k=>delete drafts[k]); setStatus("Настройки сохранены."); setTimeout(()=>setStatus(""),2500); }
      sv.disabled=false; });
    p.appendChild(f);
    if(isMember(cid)) p.appendChild(leaveNode(cid, true));
    return p;
  }
  function leaveNode(cid, inline){
    const box = el(inline?"div":"section", inline?"btns left":"panel");
    const b = el("button","btn ghost","Покинуть челлендж"); b.type="button"; let armed=false;
    b.addEventListener("click", async () => { if(!armed){ armed=true; b.textContent="Все твои отчёты здесь удалятся. Нажми ещё раз"; setTimeout(()=>{armed=false; b.textContent="Покинуть челлендж";},5000); return; }
      try{ await fs.doc("challenges/"+cid+"/members/"+state.me).delete(); }catch(e){ setStatus(explain(e), true); } });
    box.appendChild(b); return box;
  }

  // ---------- migration from the first version (members/{uid} → challenges/english) ----------
  async function migrate(){
    try{
      const cref = fs.doc("challenges/english");
      if(state.isOwner){
        const c = await cref.get();
        if(!c.exists){
          const meta = await fs.doc("meta/challenge").get().catch(()=>null);
          const mv = meta && meta.exists ? meta.data() : {};
          await cref.set({ title:"Английский каждый день", topic:"Английский", description:"20 минут английского каждый день и короткий отчёт.", minutes:20,
            goalDays: Number(mv.goalDays)||365, startDate: isKey(mv.startDate)?mv.startDate:"2026-11-09", penalty:500, dictionary:true, createdBy: state.me, createdAt:"2026-11-09T00:00:00.000Z", paid:{} });
        }
      }
      const old = await fs.doc("members/"+state.me).get();
      if(!old.exists) return;
      const o = old.data() || {};
      const nref = fs.doc("challenges/english/members/"+state.me);
      const cur = (await nref.get()).data() || {};
      const patch = {};
      if(!cur.nick && o.nick) patch.nick = o.nick;
      if(!cur.emoji && o.emoji) patch.emoji = o.emoji;
      if(!cur.joinedAt && o.joinedAt) patch.joinedAt = o.joinedAt;
      const addMissing = (src, dst) => { const out = {}; let any=false; for(const k in (src||{})){ if(!dst || !(k in dst)){ out[k]=src[k]; any=true; } } return any?out:null; };
      const d = addMissing(o.days, cur.days); if(d) patch.days = d;
      if(o.goals){ const g = {}; let any=false; for(const k of ["year","system"]) if(o.goals[k] && !(cur.goals && cur.goals[k])){ g[k]=o.goals[k]; any=true; }
        const mm = addMissing(o.goals.months, cur.goals && cur.goals.months); if(mm){ g.months=mm; any=true; } if(any) patch.goals = g; }
      if(o.comments){ const cc = {}; let any=false; for(const wk in o.comments){ const m = addMissing(o.comments[wk], cur.comments && cur.comments[wk]); if(m){ cc[wk]=m; any=true; } } if(any) patch.comments = cc; }
      if(Object.keys(patch).length){ if(!cur.joinedAt && !patch.joinedAt) patch.joinedAt = new Date().toISOString(); await nref.set(patch, {merge:true}); }
    }catch(e){ /* перенос не критичен */ }
  }

  // ---------- boot ----------
  document.addEventListener("click", () => { if(openEmoji){ openEmoji=false; render(); } });
  let lastDay = today(); setInterval(() => { if(today()!==lastDay){ lastDay=today(); render(); } }, 60000);

  if(!window.firebase || !window.FIREBASE_CONFIG){ setStatus("Не удалось загрузить базу. Обнови страницу.", true); return; }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  fs = firebase.firestore(); auth = firebase.auth(); FV = firebase.firestore.FieldValue;
  parseRoute(); render();
  const timer = setTimeout(() => { if(!state.loadedChallenges) setStatus("Данные пока не загрузились. Проверь интернет.", true); }, 10000);
  fs.collection("challenges").onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { const v=d.data(); if(v && typeof v==="object") next[d.id]=v; });
    state.challenges = next; state.loadedChallenges = true; clearTimeout(timer); render();
  }, () => { clearTimeout(timer); setStatus("Связь с базой потеряна. Обнови страницу.", true); });
  auth.getRedirectResult().catch(()=>{});
  auth.onAuthStateChanged(async u => {
    state.signedIn = !!u; state.me = u ? u.uid : null; state.myName = u ? (u.displayName||"") : ""; state.isOwner = !!(u && u.email===OWNER_EMAIL);
    setStatus(""); render();
    if(u){ await migrate(); }
  });
})();

</script>
