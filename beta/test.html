// Серия с пропуском: 4 выполненных дня подряд дают 1 пропуск (максимум 1).
// Пропуск не ломает и не увеличивает серию. Пропуск без запаса (или 2 подряд) — срыв.
// Срыв при серии >= 1 даёт штраф. Сегодняшний день, если ещё не выполнен, не считается пропуском.
function computeStreak(days, fromKey, todayKey, goalMin, addDays, minsOf){
  let streak = 0, best = 0, earn = 0, freeze = 0, skipsUsed = 0;
  const breaks = [];   // даты срывов (день, когда серия слетела) и длина слетевшей серии
  const skips = [];    // дни, закрытые пропуском
  if(!fromKey || fromKey > todayKey) return { streak, best, freeze, toNext: 4, breaks, skips, doneToday:false };
  const step = (k, done) => {
    if(done){
      streak++; if(streak > best) best = streak;
      if(freeze === 0){ earn++; if(earn >= 4){ freeze = 1; earn = 0; } }
    } else if(freeze > 0){
      freeze = 0; earn = 0; skipsUsed++; skips.push(k);
    } else {
      if(streak > 0) breaks.push({ date:k, lost:streak });
      streak = 0; earn = 0;
    }
  };
  for(let k = fromKey; k < todayKey; k = addDays(k, 1)) step(k, minsOf(days[k]) >= goalMin);
  const doneToday = minsOf(days[todayKey]) >= goalMin;
  if(doneToday) step(todayKey, true);
  return { streak, best, freeze, toNext: freeze ? 0 : 4 - earn, breaks, skips, skipsUsed, doneToday };
}

  // ---- черновик отчёта: не теряется при смене даты и перезагрузке ----
  const REP_KEY_RE = /^(fMin|fText|fWords|fv-.*)$/;
  const typedDraft = () => Object.keys(drafts).some(k => /^(fText|fWords|fv-.*)$/.test(k) && String(drafts[k]||"").trim());
  const blocksTyped = (st) => !!(st && st.blocks && st.blocks.some(b => Object.values(b.vals||{}).some(x => String(x||"").trim())));
  function backupDraft(cid){ try{ const o = {}; Object.keys(drafts).forEach(k => { if(REP_KEY_RE.test(k) || k==="fDate") o[k] = drafts[k]; });
    const st = blockState[cid]; if(st) o._blocks = st.blocks; localStorage.setItem("repdraft:"+cid, JSON.stringify(o)); }catch(e){} }
  function dropDraft(cid){ try{ localStorage.removeItem("repdraft:"+cid); }catch(e){} }
  const restoredDraft = new Set();
  function restoreDraft(cid){
    if(restoredDraft.has(cid)) return; restoredDraft.add(cid);
    let o = null; try{ o = JSON.parse(localStorage.getItem("repdraft:"+cid)||"null"); }catch(e){}
    if(!o || typeof o!=="object") return;
    Object.keys(o).forEach(k => { if((REP_KEY_RE.test(k) || k==="fDate") && typeof o[k]==="string" && !(k in drafts)) drafts[k] = o[k]; });
    if(Array.isArray(o._blocks) && o._blocks.length && !blockState[cid] && isKey(o.fDate||"")) blockState[cid] = { date: o.fDate, blocks: o._blocks.filter(b => b && typeof b==="object").map(b => ({ vals: (b.vals && typeof b.vals==="object") ? b.vals : {} })), act: 0, restored: true };
    if(Object.keys(o).some(k => /^(fText|fWords|fv-.*)$/.test(k) && String(o[k]||"").trim()) || blocksTyped(blockState[cid])) editingReport.add(cid);
  }
  // После полуночи до 5 утра отчёт по умолчанию — за вчера (если за вчера его ещё нет)

    const h = new Date().getHours(), y = addDays(today(), -1), d = daysOf(cid, state.me);
    if(h < 5 && !d[y] && !d[today()]) return y;
    return today();
  }

      for(const [fd, n] of ctrls){ if(fd.req && !n.value.trim()){ show("Заполни поле «"+fd.label+"».", true); return; } }

        else if(fd.type==="list") v[fd.id] = raw.split("\n").map(x => x.trim()).filter(Boolean).slice(0,60).map(x => x.slice(0,200));

      if(fsnap.length) rec.f = fsnap; if(Object.keys(v).length) rec.v = v;

  // ---------- разбор строки «слово — перевод» и починка уже записанных слов ----------
  const SEP_RE = /\s*[—–]\s*|\s+-\s*|\s*-\s+|\s*=\s*|\t/;      // тире, дефис с пробелом хотя бы с одной стороны, =, таб
  const hasLat = (x) => /[a-z]/i.test(x), hasCyr = (x) => /[а-яё]/i.test(x);
  const trimPunct = (x) => String(x||"").replace(/^[\s,;.\-–—:]+|[\s,;\-–—:]+$/g,"").trim();
  const NOTE_RE = /^(разг(оворное|\.)?|сленг|формальн(ое|о)|неформальн(ое|о)|брит(анское|\.)?|амер(иканское|\.)?|устар(евшее|\.)?|ирон(ично|\.)?|груб(о|ое)|офиц(иально|\.)?)$/i;
  function splitPair(line){
    const s = String(line||"").trim(); const m = s.match(SEP_RE);
    if(!m) return { en: trimPunct(s), ru: "" };

  function normalizeWords(list){

      const origKey = wordKey(w.en);

      if(!ru.trim()){ const p = splitPair(en); en = p.en; ru = p.ru; } else { en = trimPunct(en); ru = trimPunct(ru); }
      if(!en) return;
      if(!hasLat(en) && hasLat(ru) && hasCyr(en)){ const t = en; en = ru; ru = t; }          // написали наоборот
      const prev = out[out.length-1];
      if(!ru && hasCyr(en) && !hasLat(en) && prev && hasLat(prev.en)){                    // перевод уехал на отдельную строку
        if(!prev.ru) prev.ru = en;
        else if(NOTE_RE.test(prev.ru)) prev.ru = en + " (" + prev.ru.toLowerCase() + ")";
        else prev.ru = prev.ru + ", " + en;
        if(!prev.keys.includes(origKey)) prev.keys.push(origKey); return;
      }
      if(ru && NOTE_RE.test(ru) && !hasLat(ru)){ /* «разговорное» без перевода — оставим как пометку, перевод может прийти следующей строкой */ }
      out.push({ en: en.slice(0,80), ru: ru.slice(0,160), keys: [origKey] });
    });
    out.forEach(w => { const k = wordKey(w.en); if(!w.keys.includes(k)) w.keys.unshift(k); else { w.keys = [k].concat(w.keys.filter(x => x!==k)); } });

  function allWords(cid){

    memberIds(cid).forEach(uid => { const d=daysOf(cid, uid); Object.keys(d).sort().reverse().forEach(k => {
      normalizeWords(d[k].words).forEach(w => { const key=w.en.toLowerCase().trim(); if(seen.has(key)){ const o = out.find(x => x.en.toLowerCase().trim()===key); if(o) w.keys.forEach(kk => { if(!o.keys.includes(kk)) o.keys.push(kk); }); return; } seen.add(key); out.push({en:w.en,ru:w.ru,keys:w.keys,uid,k}); }); }); });
    return out.sort((a,b) => b.k.localeCompare(a.k));
  }

  // ======================= ПЛАН С ЧЕК-ПОЙНТАМИ И ПОЛЯ ОТЧЁТА =======================
  // Данные плана лежат в challenges/{cid}/members/{uid}.plan = { "YYYY-MM": { items:[{id,title,size,why,intro,note,done}] } }
  // Поля отчёта: challenges/{cid}.fields = [{id,label,type,req}], шаблон плана: challenges/{cid}.planTemplate (JSON-строка)
  const PLAN_MAX_ITEMS = 80, PLAN_MAX_BYTES = 850000, TPL_MAX = 200000;

  function resetUiState(){

  // ---- поля отчёта ----

  function cleanFields(arr){
    const out=[], seen=new Set();
    (Array.isArray(arr)?arr:[]).forEach(f => {
      if(!f || typeof f!=="object") return;
      const id = String(f.id||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,20);
      let type = FTYPES.some(t => t[0]===f.type) ? f.type : "short";
      if(id==="words") type="list"; if(id==="text" && type!=="short" && type!=="long") type="long";
      const label = str(f.label,60) || (FTYPES.find(t => t[0]===type)||["","Поле"])[1];
      if(!id || !label || seen.has(id)) return; seen.add(id); out.push({ id, label, type, req: !!f.req });
    });
    return out.slice(0,12);
  }
  const blockNoun = (cid) => { const c = ch(cid)||{}; return c.blocks ? (str(c.blocks,20) || "Книга") : ""; };
  const fieldsOf = (cid) => { const c = ch(cid)||{}; return Array.isArray(c.fields) ? cleanFields(c.fields) : defaultFields(!!c.dictionary); };

  const PRESETS = [

    ["code","Код", d => ensureWords([{id:"text",label:"Что сделал",type:"long",req:true},{id:"p"+rid(),label:"Ссылка на коммит или PR",type:"short"}], d)]
  ];

  function fieldValueText(rec, f){

  // ---- разбор шаблона плана (JSON или XML) ----
  function cleanItem(i, doneMap, notes){
    if(!i || typeof i!=="object") return null;
    const title = str(i.title,200); if(!title) return null;
    const oid = String(i.id||"");
    let done = isKey(i.done) ? i.done : (i.done===true ? today() : null);
    if(!done && oid && doneMap && doneMap[oid]) done = today();
    return { id: rid()+rid().slice(0,2), title, size:str(i.size,40), why:str(i.why,400), intro:str(i.intro,400), note: str(i.note,600) || str(notes && notes[oid],600), done };
  }
  function xmlToData(txt){
    const doc = new DOMParser().parseFromString(txt, "application/xml");
    if(doc.getElementsByTagName("parsererror").length) throw new Error("XML не читается: проверь теги.");
    const g = (n, t) => { const c = Array.prototype.find.call(n.children, x => x.tagName===t); return c ? c.textContent.trim() : (n.getAttribute(t)||""); };
    const months = Array.prototype.map.call(doc.getElementsByTagName("month"), m => ({ id: m.getAttribute("id")||"", items: Array.prototype.map.call(m.getElementsByTagName("item"), it => ({ title:g(it,"title"), size:g(it,"size"), why:g(it,"why"), intro:g(it,"intro"), note:g(it,"note"), done:g(it,"done")||null })) }));
    return { months };
  }
  function normalizePlan(data){
    if(!data || typeof data!=="object" || Array.isArray(data)) throw new Error('Нужен объект вида {"format":"obsession-plan","version":1,"months":[…]}. Пример — в «Формат шаблона и пример».');
    if(data.format!=null && data.format!=="obsession-plan") throw new Error('Это не шаблон плана Obsession: format должен быть "obsession-plan".');
    if(Number(data.version||1) > 1) throw new Error("Шаблон новее приложения (version "+data.version+"). Обнови Obsession.");
    const doneMap = data.done && typeof data.done==="object" && !Array.isArray(data.done) ? data.done : {};
    const notes = data.notes && typeof data.notes==="object" ? data.notes : {};
    const months = Array.isArray(data.months) ? data.months : (Array.isArray(data.plan) ? data.plan : null);
    if(!months) throw new Error('Нет массива months. Месяц: {"id":"2026-11","items":[{"title":"…"}]}.');
    const out = {}, skipped = []; let count = 0;
    months.forEach((m, mi) => {
      if(!m || typeof m!=="object"){ skipped.push("месяц №"+(mi+1)+": не объект"); return; }
      const id = String(m.id||""); if(!MONTH_ID.test(id)){ skipped.push("месяц №"+(mi+1)+": id «"+id.slice(0,12)+"» не вида ГГГГ-ММ"); return; }
      const arr = Array.isArray(m.items) ? m.items : []; if(!arr.length) skipped.push(id+": нет items");
      arr.forEach((i, ii) => { const it = cleanItem(i, doneMap, notes);
        if(!it) skipped.push(id+", пункт "+(ii+1)+": нет title");
        else { out[id] = out[id] || []; if(out[id].length < PLAN_MAX_ITEMS) out[id].push(it); else skipped.push(id+": больше "+PLAN_MAX_ITEMS+" пунктов, лишние отброшены"); } });
    });
    const ks = Object.keys(out);
    if(!ks.length) throw new Error("В файле нет ни одного пункта с корректным месяцем (ГГГГ-ММ) и title."+(skipped.length ? " Проблемы: "+skipped.slice(0,3).join("; ")+"." : ""));
    ks.forEach(k => count += out[k].length);
    return { months: out, count, monthsN: ks.length, skipped };
  }
  function parsePlanText(txt){
    txt = String(txt||"").replace(/^﻿/,"").trim(); if(!txt) throw new Error("Файл пустой.");
    let data;
    if(txt[0]==="<") data = xmlToData(txt);
    else { try{ data = JSON.parse(txt); }catch(e){ throw new Error("JSON не читается: проверь запятые, кавычки и скобки ("+String(e.message).slice(0,50)+")."); } }
    return normalizePlan(data);
  }
  const planWord = (n) => n+" "+plural(n,"пункт","пункта","пунктов");

  // ---- чтение плана участника ----
  const planOf = (cid, uid) => { const m = memberOf(cid, uid); return m && m.plan && typeof m.plan==="object" ? m.plan : {}; };
  const _miCache = new WeakMap();   // кэш по ссылке на массив пунктов: документ от Firestore неизменяем между снапшотами
  function monthItems(cid, uid, mk){
    const mm = planOf(cid, uid)[mk]; const arr = mm && Array.isArray(mm.items) ? mm.items : [];
    const hit = _miCache.get(arr); if(hit) return hit.map(x => Object.assign({}, x));
    const out = monthItemsRaw(arr); _miCache.set(arr, out); return out.map(x => Object.assign({}, x));
  }
  function monthItemsRaw(arr){ const out = [];
    arr.forEach(i => { if(!i || typeof i!=="object") return; const title = str(i.title,200); if(!title) return;
      out.push({ id:String(i.id||"").slice(0,30) || ("x"+out.length), title, size:str(i.size,40), why:str(i.why,400), intro:str(i.intro,400), note:str(i.note,600), done: isKey(i.done) ? i.done : null }); });
    return out.slice(0,PLAN_MAX_ITEMS);
  }
  function planStat(cid, uid, mk){ const it = monthItems(cid, uid, mk || monthKey()); return { total: it.length, done: it.filter(i => i.done).length }; }
  async function savePlanMonths(cid, map){
    const total = JSON.stringify(memberOf(cid, state.me) || {}).length + JSON.stringify(map).length;   // весь документ участника: отчёты + план (лимит Firestore 1 МБ)
    if(total > PLAN_MAX_BYTES){ flash("План вместе с отчётами слишком большой для хранения (лимит базы ~1 МБ). Сократи описания или убери лишние пункты.", true); return false; }
    const plan = {}; Object.keys(map).forEach(k => { plan[k] = { items: map[k] }; });
    return saveMember(cid, { plan });
  }
  function templatePatch(cid){ return templatePatchOf(ch(cid)); }
  function templatePatchOf(c){
    if(!c || !c.planEnabled || typeof c.planTemplate!=="string" || !c.planTemplate) return {};
    try{ const p = normalizePlan(JSON.parse(c.planTemplate)); const plan = {}; Object.keys(p.months).forEach(k => { plan[k] = { items: p.months[k].map(x => Object.assign({}, x, { done:null, note:"" })) }; }); return { plan }; }
    catch(e){ return {}; }
  }
  // Загрузка плана из файла или шаблона ЗАМЕНЯЕТ весь план целиком (старые месяцы удаляются)
  async function importPlan(cid, text){
    let p; try{ p = parsePlanText(text); }catch(e){ flash(e.message, true); return; }
    const plan = {}; let n = 0;
    Object.keys(p.months).forEach(k => { const items = p.months[k].slice(0,PLAN_MAX_ITEMS); if(items.length){ plan[k] = { items }; n += items.length; } });
    if(!n){ flash("В файле нет ни одного пункта плана.", true); return; }
    const m = Object.assign({}, memberOf(cid, state.me) || {}); delete m.plan;
    if(JSON.stringify(m).length + JSON.stringify(plan).length > PLAN_MAX_BYTES){ flash("План вместе с отчётами слишком большой для хранения (лимит базы ~1 МБ). Сократи описания или убери лишние пункты.", true); return; }
    try{ await fs.doc("challenges/"+cid+"/members/"+state.me).update({ plan }); }
    catch(e){ setStatus(explain(e), true); return; }
    const mc = Object.keys(plan).length;
    flash("План заменён: "+planWord(n)+" в "+mc+" "+plural(mc,"месяц","месяца","месяцев")+"."+(p.skipped.length ? " Пропущено строк: "+p.skipped.length+" — "+p.skipped.slice(0,2).join("; ")+"." : ""));
  }
  function exportPlan(cid){
    const pl = planOf(cid, state.me); const months = Object.keys(pl).filter(k => MONTH_ID.test(k)).sort().map(k => ({ id:k, items: monthItems(cid, state.me, k).map(({title,size,why,intro,note,done}) => ({title,size,why,intro,note,done})) }));
    const blob = new Blob([JSON.stringify({ format:"obsession-plan", version:1, months }, null, 2)], { type:"application/json" });

    const [l6,st] = mk("sStart","Дата старта","date",startOf(cid));
    const [l7,pn] = mk("sPen","Штраф, ₽","number",penaltyOf(cid),{min:0,max:100000,step:50});
    const dl = el("label","check"); const dc = el("input"); dc.type="checkbox"; dc.id="sDict"; dc.checked=!!c.dictionary; dl.htmlFor="sDict"; dl.append(dc, document.createTextNode("Общий словарь новых слов"));
    const r1=el("div","row2"); r1.append(l4,l5); const r2=el("div","row2"); r2.append(l6,l7);
    f.append(l1,l2,l3,r1,r2,dl);
    const fe = fieldsEditor(cid, fieldsOf(cid), () => dc.checked);
    dc.addEventListener("change", () => { fieldDrafts[cid] = ensureWords(fieldDrafts[cid], dc.checked); fe.redraw(); });
    f.append(el("h3",null,"Форма отчёта"), el("div","hint","Поля, которые участники заполняют каждый день. Старые отчёты остаются как были."), fe.node);
    const ml = el("label","check"); const mc = el("input"); mc.type="checkbox"; mc.id="sBlocks"; mc.checked=!!c.blocks; ml.htmlFor="sBlocks"; ml.append(mc, document.createTextNode("Несколько блоков в одном отчёте (например, по каждой книге)"));
    const mnl = el("label",null,"Как называть блок"); const mni = el("input"); mni.type="text"; mni.id="sBlockNoun"; mni.maxLength=20; mni.value = (c.blocks && str(c.blocks,20)) || "Книга"; mnl.htmlFor="sBlockNoun"; mnl.appendChild(mni);
    const mh = el("div","hint","Все поля, кроме минут и слов, повторяются для каждого блока. Первое поле «Короткий текст» станет названием блока (например, «Какую книгу читаешь»).");
    const mbox = el("div"); mbox.append(mnl, mh); mbox.hidden = !mc.checked; mc.addEventListener("change", () => { mbox.hidden = !mc.checked; });
    f.append(ml, mbox);
    const pl = el("label","check"); const pc = el("input"); pc.type="checkbox"; pc.id="sPlan"; pc.checked=!!c.planEnabled; pl.htmlFor="sPlan"; pl.append(pc, document.createTextNode("План с чек-пойнтами по месяцам (у каждого участника свой)"));
    const tb = templateBox(cid, c.planTemplate); tb.hidden = !pc.checked; pc.addEventListener("change", () => { tb.hidden = !pc.checked; });
    f.append(pl, tb);
    const btns = el("div","btns left"); const sv = el("button","btn primary","Сохранить настройки"); sv.type="submit"; btns.appendChild(sv);
    const del = el("button","btn ghost","Удалить челлендж"); del.type="button"; let armed=false;
    del.addEventListener("click", async () => { if(!armed){ armed=true; del.textContent="Удалить навсегда? Нажми ещё раз"; setTimeout(()=>{armed=false; del.textContent="Удалить челлендж";},4000); return; }
      try{ await fs.doc("challenges/"+cid).delete(); location.hash=""; }catch(e){ setStatus(explain(e), true); } });
    btns.appendChild(del); f.appendChild(btns);
    f.addEventListener("submit", async ev => { ev.preventDefault(); sv.disabled=true;
      const ok = await saveChallenge(cid, { title: t.value.trim().slice(0,60) || c.title, topic: tp.value.trim().slice(0,30), description: ds.value.trim().slice(0,400),
        minutes: clampNum(mn.value,1,600,goalMinOf(cid)), goalDays: clampNum(gd.value,1,1000,goalDaysOf(cid)), startDate: isKey(st.value)?st.value:startOf(cid), penalty: clampNum(pn.value,0,100000,penaltyOf(cid)), dictionary: dc.checked, fields: cleanFields(ensureWords(fieldDrafts[cid], dc.checked)), planEnabled: pc.checked, blocks: mc.checked ? (mni.value.trim().slice(0,20) || "Книга") : "", ...(cid in tplDrafts ? { planTemplate: tplDrafts[cid] } : {}) });
      if(ok){ ["sTitle","sTopic","sDesc","sMin","sGoal","sStart","sPen"].forEach(k=>delete drafts[k]); delete fieldDrafts[cid]; delete tplDrafts[cid]; render(); setStatus("Настройки сохранены."); setTimeout(()=>setStatus(""),2500); }
      sv.disabled=false; });
    p.appendChild(f);
    if(isMember(cid)) p.appendChild(leaveNode(cid, true));
    return outer;
  }
  function leaveNode(cid, inline){
    const box = el(inline?"div":"section", inline?"btns left":"panel");
    const b = el("button","btn ghost","Покинуть челлендж"); b.type="button"; let armed=false;
    b.addEventListener("click", async () => { if(!armed){ armed=true; b.textContent="Все твои отчёты здесь удалятся. Нажми ещё раз"; setTimeout(()=>{armed=false; b.textContent="Покинуть челлендж";},5000); return; }
      try{ await fs.doc("challenges/"+cid+"/members/"+state.me).delete(); }catch(e){ setStatus(explain(e), true); } });
    box.appendChild(b); return box;
  }

  // ---------- migration from the first version (members/{uid} → challenges/english) ----------
  async function migrateOne(uid, o){
      const nref = fs.doc("challenges/english/members/"+uid);
      const cur = (await nref.get()).data() || {};
      const patch = {};
      if(!cur.nick && o.nick) patch.nick = o.nick;
      if(!cur.emoji && o.emoji) patch.emoji = o.emoji;
      if(!cur.joinedAt && o.joinedAt) patch.joinedAt = o.joinedAt;
      const addMissing = (src, dst) => { const out = {}; let any=false; for(const k in (src||{})){ if(!dst || !(k in dst)){ out[k]=src[k]; any=true; } } return any?out:null; };
      const d = addMissing(o.days, cur.days); if(d) patch.days = d;
      if(o.goals){ const g = {}; let any=false; for(const k of ["year","system"]) if(o.goals[k] && !(cur.goals && cur.goals[k])){ g[k]=o.goals[k]; any=true; }
        const mm = addMissing(o.goals.months, cur.goals && cur.goals.months); if(mm){ g.months=mm; any=true; } if(any) patch.goals = g; }
      if(o.comments){ const cc = {}; let any=false; for(const wk in o.comments){ const m = addMissing(o.comments[wk], cur.comments && cur.comments[wk]); if(m){ cc[wk]=m; any=true; } } if(any) patch.comments = cc; }
      if(Object.keys(patch).length){ if(!cur.joinedAt && !patch.joinedAt) patch.joinedAt = new Date().toISOString(); await nref.set(patch, {merge:true}); }
  }
  async function migrate(){
    try{
      const cref = fs.doc("challenges/english");
      if(state.isOwner){
        const c = await cref.get();
        if(!c.exists){
          const meta = await fs.doc("meta/challenge").get().catch(()=>null);
          const mv = meta && meta.exists ? meta.data() : {};
          await cref.set({ title:"Английский каждый день", topic:"Английский", description:"20 минут английского каждый день и короткий отчёт.", minutes:20,
            goalDays: Number(mv.goalDays)||365, startDate: isKey(mv.startDate)?mv.startDate:"2026-11-09", penalty:500, dictionary:true, createdBy: state.me, createdAt:"2026-11-09T00:00:00.000Z", paid:{} });
        }
      }
      // владелец сайта переносит всех участников первой версии, остальные — только себя
      const olds = state.isOwner ? (await fs.collection("members").get()).docs : [await fs.doc("members/"+state.me).get()];
      for(const old of olds){ if(old.exists) await migrateOne(old.id, old.data() || {}); }
    }catch(e){ /* перенос не критичен */ }
  }

  // ---------- boot ----------
  document.addEventListener("click", () => { if(openEmoji){ openEmoji=false; render(); } });
  let lastDay = today(); setInterval(() => { if(today()!==lastDay){ lastDay=today(); render(); } }, 60000);

  if(!window.firebase || !window.FIREBASE_CONFIG){ setStatus("Не удалось загрузить базу. Обнови страницу.", true); return; }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  fs = firebase.firestore(); auth = firebase.auth(); FV = firebase.firestore.FieldValue;
  parseRoute(); render();
  const timer = setTimeout(() => { if(!state.loadedChallenges) setStatus("Данные пока не загрузились. Проверь интернет.", true); }, 10000);
  fs.collection("challenges").onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { const v=d.data(); if(v && typeof v==="object") next[d.id]=v; });
    state.challenges = next; state.loadedChallenges = true; clearTimeout(timer); scheduleRender();
  }, () => { clearTimeout(timer); setStatus("Связь с базой потеряна. Обнови страницу.", true); });
  auth.getRedirectResult().catch(()=>{});
  auth.onAuthStateChanged(async u => {
    if((u ? u.uid : null) !== state.me) resetUiState();
    state.signedIn = !!u; state.me = u ? u.uid : null; state.myName = u ? (u.displayName||"") : ""; state.isOwner = !!(u && u.email===OWNER_EMAIL);
    setStatus(""); render();
    if(u){ await migrate(); }
  });
})();

</script>
